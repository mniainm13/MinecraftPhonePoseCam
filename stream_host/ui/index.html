<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PhoneCam Stream</title>
<style>
:root {
  --bg: #0B1220;
  --surface: #141C2C;
  --surface2: #1C2638;
  --outline: #2A3548;
  --text: #E8EEF8;
  --muted: #8A9BB8;
  --primary: #3D7EFF;
  --on-primary: #fff;
  --ok: #7DDEA2;
  --warn: #F5C451;
  --err: #F07178;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 20px 48px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #7A5CFF);
}
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 24px; }

.card {
  background: var(--surface);
  border: 1px solid var(--outline);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
}
.card h2 {
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .02em;
}
.row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.field { flex: 1 1 140px; min-width: 120px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input, .field select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--outline);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}
.field input:focus { border-color: var(--primary); }

.status-line {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 13px;
  margin-bottom: 10px;
}
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--muted);
}
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.err { background: var(--err); }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px;
  margin-top: 8px;
}
.stat {
  background: var(--surface2);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.stat .v {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 18px;
  font-weight: 600;
  color: var(--primary);
}
.stat .k { font-size: 11px; color: var(--muted); margin-top: 2px; }

.btns { display: flex; gap: 10px; margin-top: 6px; }
button {
  border: none;
  border-radius: 999px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
}
.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--outline) !important;
}
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>PhoneCam Stream</h1>
      <div class="sub">DXGI → NVENC 推流主机 · Material 3 深色</div>
    </div>
  </div>

  <div class="card">
    <h2>运行状态</h2>
    <div class="status-line">
      <span class="dot" id="dot"></span>
      <span id="statusText">未连接</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="stFps">–</div><div class="k">FPS</div></div>
      <div class="stat"><div class="v" id="stBr">–</div><div class="k">Mbps</div></div>
      <div class="stat"><div class="v" id="stClient">–</div><div class="k">客户端</div></div>
      <div class="stat"><div class="v" id="stRes">–</div><div class="k">分辨率</div></div>
    </div>
  </div>

  <div class="card">
    <h2>推流设置</h2>
    <div class="row">
      <div class="field">
        <label>TCP 端口</label>
        <input id="port" type="number" value="8091" />
      </div>
      <div class="field">
        <label>码率 Mbps</label>
        <input id="bitrate" type="number" value="20" min="2" max="80" />
      </div>
      <div class="field">
        <label>FPS</label>
        <input id="fps" type="number" value="30" min="15" max="60" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>裁切比例</label>
        <select id="crop">
          <option value="">不裁切（按分辨率）</option>
          <option value="9:19.5">手机竖屏 9:19.5</option>
          <option value="16:9">横屏 16:9</option>
        </select>
      </div>
      <div class="field">
        <label>输出分辨率</label>
        <select id="res">
          <option value="1280x720">1280×720 (720p)</option>
          <option value="1920x1080">1920×1080 (1080p)</option>
          <option value="2560x1440">2560×1440 (2K)</option>
          <option value="3840x2160">3840×2160 (4K)</option>
          <option value="custom">自定义…</option>
        </select>
      </div>
    </div>
    <div class="row" id="customResRow" style="display:none">
      <div class="field">
        <label>宽</label>
        <input id="customW" type="number" value="2560" min="320" max="7680" />
      </div>
      <div class="field">
        <label>高</label>
        <input id="customH" type="number" value="1440" min="240" max="4320" />
      </div>
    </div>
    <div class="btns">
      <button class="btn-primary" id="btnStart">启动推流</button>
      <button class="btn-ghost" id="btnStop">停止</button>
      <button class="btn-ghost" id="btnSave">保存设置</button>
    </div>
  </div>

  <div class="card">
    <h2>网络 / 通道</h2>
    <div class="status-line">
      <span class="dot" id="netDot"></span>
      <span id="netText">点「检查端口」看防火墙与本机 IP</span>
    </div>
    <p class="hint" id="netDetail" style="margin:8px 0 0"></p>
    <div class="btns" style="margin-top:12px">
      <button class="btn-ghost" id="btnNet">检查端口 / 防火墙</button>
      <button class="btn-ghost" id="btnCopyIp">复制本机 IP</button>
    </div>
  </div>

  <div class="card">
    <h2>说明</h2>
    <p class="hint">
      本页为 UI 原型；Electron 版会调用本地 <code>phonecam_enc.exe</code> 并读状态。<br/>
      控制口 = 视频端口 + 1（默认 8092）。位姿在 Minecraft mod（默认 42424）。
    </p>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let sim = false;
let lastIp = '';

function parseRes() {
  const v = $('res').value;
  if (v === 'custom') {
    const w = Math.max(320, Number($('customW').value) || 2560);
    const h = Math.max(240, Number($('customH').value) || 1440);
    return { w, h };
  }
  const [w, h] = v.split('x').map(Number);
  return { w, h };
}

$('res').addEventListener('change', () => {
  $('customResRow').style.display = $('res').value === 'custom' ? 'flex' : 'none';
});

function fillResolutions(list) {
  const sel = $('res');
  // keep static presets; prepend native if present
  const native = list.find((x) => x.native);
  if (native) {
    const id = native.w + 'x' + native.h;
    if (![...sel.options].some((o) => o.value === id)) {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = native.label;
      sel.insertBefore(o, sel.firstChild);
      sel.value = id;
    }
  }
}

(async () => {
  try {
    if (window.electronAPI?.listRes) {
      const list = await window.electronAPI.listRes();
      if (list && list.length) fillResolutions(list);
    } else {
      const w = screen.width;
      const h = screen.height;
      if (w >= 1280) {
        const id = w + 'x' + h;
        const sel = $('res');
        if (![...sel.options].some((o) => o.value === id)) {
          const o = document.createElement('option');
          o.value = id;
          o.textContent = `本机 ${w}×${h}`;
          sel.insertBefore(o, sel.firstChild);
          sel.value = id;
        }
      }
    }
  } catch (_) {}
})();

$('btnStart').onclick = async () => {
  const { w, h } = parseRes();
  const opts = {
    port: $('port').value,
    bitrate: $('bitrate').value,
    fps: $('fps').value,
    cropAr: $('crop').value,
    width: w,
    height: $('crop').value ? 0 : h,
  };
  try {
    if (window.electronAPI?.encStart) await window.electronAPI.encStart(opts);
  } catch (_) {}
  sim = true;
  $('dot').className = 'dot on';
  $('statusText').textContent = '推流中 · TCP :' + $('port').value;
};
$('btnStop').onclick = async () => {
  try {
    if (window.electronAPI?.encStop) await window.electronAPI.encStop();
  } catch (_) {}
  sim = false;
  $('dot').className = 'dot';
  $('statusText').textContent = '已停止';
  $('stFps').textContent = '–';
};
$('btnSave').onclick = async () => {
  const { w, h } = parseRes();
  const cfg = {
    port: Number($('port').value),
    bitrate: Number($('bitrate').value),
    fps: Number($('fps').value),
    crop_ar: $('crop').value || null,
    width: w,
    height: $('crop').value ? 0 : h,
  };
  localStorage.setItem('phonecam_stream', JSON.stringify(cfg));
  try {
    if (window.electronAPI?.saveConfig) await window.electronAPI.saveConfig(cfg);
    $('statusText').textContent = '已保存 config.json（软件目录）';
  } catch (_) {
    $('statusText').textContent = '已保存（浏览器 localStorage）';
  }
};

try {
  const s = JSON.parse(localStorage.getItem('phonecam_stream') || 'null');
  if (s) {
    $('port').value = s.port ?? 8091;
    $('bitrate').value = s.bitrate ?? 20;
    $('fps').value = s.fps ?? 30;
    $('crop').value = s.crop ?? s.crop_ar ?? '';
    if (s.width) $('res').value = s.width + 'x' + (s.height || Math.round(s.width * 9 / 16));
  }
} catch (_) {}

setInterval(() => {
  if (!sim) return;
  const fps = parseFloat($('fps').value);
  const br = parseFloat($('bitrate').value);
  $('stFps').textContent = (fps + (Math.random() - 0.5) * 2).toFixed(1);
  $('stBr').textContent = (br + (Math.random() - 0.5) * 1.5).toFixed(1);
  $('stClient').textContent = '—';
  const { w, h } = parseRes();
  $('stRes').textContent = w + '×' + h;
}, 500);

$('btnNet').onclick = async () => {
  $('netDot').className = 'dot';
  $('netText').textContent = '检查中…';
  try {
    if (window.electronAPI?.netDiagnose) {
      const r = await window.electronAPI.netDiagnose({ port: Number($('port').value) });
      lastIp = r.ip || '';
      const ok = r.fwOk !== false;
      $('netDot').className = ok ? 'dot on' : 'dot err';
      $('netText').textContent = ok
        ? '端口已放行 · 手机填：' + lastIp
        : '防火墙可能拦截 · 请以管理员运行';
      $('netDetail').textContent =
        '视频 TCP ' + r.port + ' / 控制 UDP ' + (r.port + 1) + ' / 位姿 UDP 42424\n' + (r.fwLog || '');
    } else {
      $('netDot').className = 'dot';
      $('netText').textContent = '浏览器预览：用 ipconfig 看 IPv4';
      $('netDetail').textContent = 'Electron 版会列出本机 IP 并尝试放行防火墙。';
    }
  } catch (e) {
    $('netDot').className = 'dot err';
    $('netText').textContent = '检查失败：' + (e.message || e);
  }
};
$('btnCopyIp').onclick = async () => {
  const t = lastIp || $('netDetail').textContent;
  try { await navigator.clipboard.writeText(t); } catch (_) {}
  $('netText').textContent = '已复制：' + t;
};
</script>
</body>
</html>
